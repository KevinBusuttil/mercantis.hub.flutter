name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  analyze:
    name: flutter analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter --version
      # The committed lockfile is the release's dependency set: fail rather
      # than silently resolve different versions.
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze

  test:
    name: flutter test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The DB-backed tests use sqflite_common_ffi, which needs libsqlite3.
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter test

  # The named Solo release gate (docs/release/SOLO_RELEASE_READINESS.md):
  # the canonical journey, recovery, migration, faults, upgrade, diagnostics,
  # accessibility and responsive layout. These also run in `flutter test`;
  # a separate job makes a failing release gate visible by name.
  solo-acceptance:
    name: Solo commercial acceptance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Canonical journey, backup → clean restore, opening migration
        run: >-
          flutter test
          test/solo_acceptance_test.dart
          test/opening_take_on_test.dart
          test/opening_data_screen_test.dart
      - name: Fault injection, posting outbox and upgrade safety
        run: >-
          flutter test
          test/solo_fault_test.dart
          test/posting_outbox_test.dart
          test/bin_identity_test.dart
      - name: Automatic backup and recovery-safe numbering (R2, R3)
        run: >-
          flutter test
          test/backup_protection_test.dart
          test/numbering_recovery_test.dart
      - name: Secure AI key, owed-posting retry, phone layouts (R4, R6, UX-BANKREC)
        run: >-
          flutter test
          test/capture_key_storage_test.dart
          test/retry_owed_postings_test.dart
          test/phone_layout_test.dart
      - name: Solo to Team conversion (C3)
        run: >-
          flutter test
          test/solo_to_team_test.dart
          test/team_screen_solo_guard_test.dart
      - name: Team server-restore detection and recovery (C4)
        run: >-
          flutter test
          test/team_history_test.dart
          test/team_recovery_screen_test.dart
      - name: Team authority for journals, expenses, deposits and the books lock (C5)
        run: >-
          flutter test
          test/accounting_contract_test.dart
          test/deposit_test.dart
          test/team_books_lock_test.dart
          test/team_posting_guard_test.dart
          test/team_posting_test.dart
      - name: Team protocol contract (C6)
        run: flutter test test/team_protocol_test.dart
      - name: Accounting fixtures (stock/COGS, reports)
        run: >-
          flutter test
          test/stock_cogs_acceptance_test.dart
          test/financial_reports_test.dart
          test/aggregating_reports_test.dart
      - name: Support diagnostics privacy
        run: flutter test test/support_diagnostics_test.dart
      - name: Accessibility guidelines and responsive layouts
        run: flutter test test/accessibility test/ux
      - name: Golden (marketing dashboard render)
        run: flutter test test/marketing
      - name: Host performance baselines (not device results)
        env:
          ATLAS_PERF: "1"
        run: flutter test test/perf --reporter expanded
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-perf-baseline
          path: build/perf/host_results.json
          if-no-files-found: ignore

  # C6: the Team release gate. The backend this app is built against is
  # pinned to one commit (tool/team_backend.pin). This job checks that exact
  # commit out, fails when the shared accounting fixtures or the protocol
  # contract have drifted from the hub's copies, then builds that backend,
  # runs it on PostgreSQL 16 and runs the whole Team end-to-end suite
  # (multi-device sync, server posting authority, Solo to Team, C5 authority,
  # protocol handshake, then the server-restore scenarios on their own).
  team-e2e:
    name: Team E2E and contract drift (pinned backend)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned backend
        id: pin
        run: |
          set -euo pipefail
          repository=$(sed -n 's/^repository=//p' tool/team_backend.pin)
          commit=$(sed -n 's/^commit=//p' tool/team_backend.pin)
          if [[ ! $commit =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::tool/team_backend.pin must name a full commit, not a branch or tag"; exit 1
          fi
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.repository }}
          ref: ${{ steps.pin.outputs.commit }}
          path: team-backend
      - name: The checkout is the pinned commit
        run: test "$(git -C team-backend rev-parse HEAD)" = "${{ steps.pin.outputs.commit }}"
      - name: Contract drift (accounting fixtures and protocol)
        run: ATLAS_BACKEND_DIR=team-backend bash tool/check_accounting_contract.sh
      - name: Tools (SQLite for the devices, PostgreSQL 16 client for the restore scenarios)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsqlite3-0 postgresql-client-16
      - name: Install Rust (the backend's rust-toolchain.toml)
        working-directory: team-backend
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: team-backend
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Team end-to-end suite against the pinned backend
        env:
          ATLAS_BACKEND_DIR: team-backend
          ATLAS_E2E_ADMIN_URL: postgres://atlas:atlas@localhost:5432/postgres
          PATH_TO_PG: /usr/lib/postgresql/16/bin
        run: |
          export PATH="$PATH_TO_PG:$PATH"
          bash tool/team_e2e.sh

  security:
    name: Secret and dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No signing material in the repository
        run: |
          set -euo pipefail
          found=$(git ls-files | grep -Ei '(\.jks|\.keystore|\.p12|\.pfx|\.mobileprovision|\.provisionprofile|\.p8|(^|/)key\.properties|google-services\.json|GoogleService-Info\.plist)$' || true)
          if [ -n "$found" ]; then
            echo "::error::Signing or service credentials are committed:"; echo "$found"; exit 1
          fi
      - name: Secret scan (gitleaks, full history)
        run: |
          set -euo pipefail
          curl -sSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks
          ./gitleaks git --redact --no-banner -v .
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Known-vulnerability scan of pubspec.lock (OSV)
        run: |
          set -euo pipefail
          curl -sSL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.0.2/osv-scanner_linux_amd64
          echo "3abcfd7126c453a00421487e721b296e0cb68085bd431d6cef60872774170fc8  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner scan source --lockfile pubspec.lock
      - name: Outdated dependencies (information only)
        run: flutter pub outdated --no-dev-dependencies || true

name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  analyze:
    name: flutter analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter --version
      # The committed lockfile is the release's dependency set: fail rather
      # than silently resolve different versions.
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze

  test:
    name: flutter test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The DB-backed tests use sqflite_common_ffi, which needs libsqlite3.
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter test

  # The named Solo release gate (docs/release/SOLO_RELEASE_READINESS.md):
  # the canonical journey, recovery, migration, faults, upgrade, diagnostics,
  # accessibility and responsive layout. These also run in `flutter test`;
  # a separate job makes a failing release gate visible by name.
  solo-acceptance:
    name: Solo commercial acceptance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Canonical journey, backup → clean restore, opening migration
        run: >-
          flutter test
          test/solo_acceptance_test.dart
          test/opening_take_on_test.dart
          test/opening_data_screen_test.dart
      - name: Fault injection, posting outbox and upgrade safety
        run: >-
          flutter test
          test/solo_fault_test.dart
          test/posting_outbox_test.dart
          test/bin_identity_test.dart
      - name: Accounting fixtures (stock/COGS, reports)
        run: >-
          flutter test
          test/stock_cogs_acceptance_test.dart
          test/financial_reports_test.dart
          test/aggregating_reports_test.dart
      - name: Support diagnostics privacy
        run: flutter test test/support_diagnostics_test.dart
      - name: Accessibility guidelines and responsive layouts
        run: flutter test test/accessibility test/ux
      - name: Golden (marketing dashboard render)
        run: flutter test test/marketing
      - name: Host performance baselines (not device results)
        env:
          ATLAS_PERF: "1"
        run: flutter test test/perf --reporter expanded
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-perf-baseline
          path: build/perf/host_results.json
          if-no-files-found: ignore

  security:
    name: Secret and dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No signing material in the repository
        run: |
          set -euo pipefail
          found=$(git ls-files | grep -Ei '(\.jks|\.keystore|\.p12|\.pfx|\.mobileprovision|\.provisionprofile|\.p8|(^|/)key\.properties|google-services\.json|GoogleService-Info\.plist)$' || true)
          if [ -n "$found" ]; then
            echo "::error::Signing or service credentials are committed:"; echo "$found"; exit 1
          fi
      - name: Secret scan (gitleaks, full history)
        run: |
          set -euo pipefail
          curl -sSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks
          ./gitleaks git --redact --no-banner -v .
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Known-vulnerability scan of pubspec.lock (OSV)
        run: |
          set -euo pipefail
          curl -sSL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.0.2/osv-scanner_linux_amd64
          echo "3abcfd7126c453a00421487e721b296e0cb68085bd431d6cef60872774170fc8  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner scan source --lockfile pubspec.lock
      - name: Outdated dependencies (information only)
        run: flutter pub outdated --no-dev-dependencies || true
